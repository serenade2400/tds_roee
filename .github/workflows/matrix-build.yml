name: Matrix Build CI
on: [push]
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
    - uses: actions/checkout@v3
    - name: matrix-9faccda
      run: echo "Building on ${{ matrix.os }}"
    - name: Generate artifact
      run: echo "This is the build artifact for ${{ matrix.os }}." > output.txt
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-9faccda-${{ matrix.os }}
        path: output.txt
